# Build settings for Windows 7, cross-compiled from Linux.
# The resulting .exe also runs on Windows 8, 10 and 11.
#
#   64-bit: cargo +nightly build -Zbuild-std --target x86_64-win7-windows-gnu --release
#   32-bit: cargo +nightly build -Zbuild-std --target i686-win7-windows-gnu --release
#
# Both builds read the 64-bit view of the registry, so both capture it whole
# on any Windows. The 64-bit one is the one to use on 64-bit Windows: it has
# no 2 GB memory limit for large registries. The 32-bit one is for 32-bit
# Windows.

# Rustshot only runs on Windows: every build is for Windows, also the ones
# for checking the code (cargo build, cargo clippy, rust-analyzer).
[build]
target = "x86_64-pc-windows-gnu"

# Static linking: the C runtime and the MinGW libraries go inside the .exe,
# so it is a single file with no extra DLLs.
#
# The default target is static too, so `cargo test` runs its .exe in Wine
# without looking for MinGW DLLs.
[target.x86_64-pc-windows-gnu]
runner = "wine"
rustflags = [
    "-C",
    "target-feature=+crt-static",
    "-C",
    "link-arg=-static",
]

[target.x86_64-win7-windows-gnu]
rustflags = [
    "-C",
    "target-feature=+crt-static",
    "-C",
    "link-arg=-static",
]

[target.i686-win7-windows-gnu]
rustflags = [
    "-C",
    "target-feature=+crt-static",
    "-C",
    "link-arg=-static",
]

# C/C++ compilers for the GUI (FLTK). The `cc` crate does not know the win7
# targets, so it would pick the Linux compiler without these.
[env]
# 64-bit
CC_x86_64_win7_windows_gnu = "x86_64-w64-mingw32-gcc"
CXX_x86_64_win7_windows_gnu = "x86_64-w64-mingw32-g++"
AR_x86_64_win7_windows_gnu = "x86_64-w64-mingw32-ar"
# 32-bit
CC_i686_win7_windows_gnu = "i686-w64-mingw32-gcc"
CXX_i686_win7_windows_gnu = "i686-w64-mingw32-g++"
AR_i686_win7_windows_gnu = "i686-w64-mingw32-ar"