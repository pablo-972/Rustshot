[package]
name = "Rustshot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
cli = { path = "crates/cli" }
kernel = { path = "crates/kernel" }

[workspace]
members = [
    "crates/cli",
    "crates/kernel"
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
toml = "1.2.1"
thiserror = "2.0"
serde_json = "1.0"
sha2 = "0.11.0"
winreg = "0.56.0"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
kernel = { path = "crates/kernel" }