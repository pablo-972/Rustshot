[package]
name = "Rustshot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
cli = { path = "crates/cli" }
gui = { path = "crates/gui" }
kernel = { path = "crates/kernel" }

[build-dependencies]
embed-resource = "3.0"

[workspace]
members = [
    "crates/cli",
    "crates/gui",
    "crates/kernel",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde_json = "1.0"
winreg = "0.56.0"
clap = { version = "4.0", features = ["derive"] }
fltk = "1.5"
serde = { version = "1.0.229", features = ["derive"] }
kernel = { path = "crates/kernel" }