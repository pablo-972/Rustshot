[package]
name = "Rustshot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Registry snapshots and diffs for Windows malware analysis"

[dependencies]
anyhow.workspace = true
rustshot-cli.workspace = true
rustshot-gui.workspace = true

[build-dependencies]
embed-resource = "3.0"

[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/gui",
]
resolver = "3"

# Shared by every crate: one version for the whole project.
[workspace.package]
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/pablo-972/Rustshot"

[workspace.dependencies]
# Crates of the workspace
rustshot-cli = { path = "crates/cli" }
rustshot-core = { path = "crates/core" }
rustshot-gui = { path = "crates/gui" }

# External crates
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
fltk = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
winreg = "0.56"

# A smaller and faster .exe. Panics still unwind: the GUI turns them into
# errors instead of closing.
[profile.release]
lto = true
codegen-units = 1
strip = true
